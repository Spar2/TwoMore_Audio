<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#0f131c"/>
  <style>
    .t{font:18px 'Segoe UI',sans-serif;fill:#f1f4fa}.s{font:14px 'Segoe UI',sans-serif;fill:#aab3c5}
    .p{fill:#181e29;stroke:#30394a}.b{fill:#3b82f6}.g{fill:#167454}.a{fill:#72551d}
  </style>
  <text x="32" y="40" class="t">TwoMore Audio — demo/mock workflow</text>
  <g transform="translate(32 70)">
    <rect width="340" height="240" rx="14" class="p"/><text x="22" y="38" class="t">1. Test both headphones</text>
    <rect x="22" y="58" width="296" height="48" rx="8" class="a"/><text x="42" y="88" class="t">Waking up headphones…</text>
    <circle cx="44" cy="142" r="7" fill="#4ade80"/><text x="64" y="148" class="s">Ear (stick) — Now playing</text>
    <circle cx="44" cy="180" r="7" fill="#4ade80"/><text x="64" y="186" class="s">Bose QC Ultra — Now playing</text>
    <rect x="22" y="202" width="190" height="30" rx="7" class="b"/><text x="35" y="223" class="s" fill="#fff">Playing test 2/3…</text>
  </g>
  <g transform="translate(430 70)">
    <rect width="340" height="240" rx="14" class="p"/><text x="22" y="38" class="t">2. Confirm what you heard</text>
    <rect x="22" y="62" width="296" height="48" rx="8" class="g"/><text x="56" y="92" class="t">Yes, I heard BOTH</text>
    <rect x="22" y="122" width="296" height="42" rx="8" class="a"/><text x="75" y="149" class="t">I heard only ONE</text>
    <rect x="22" y="176" width="296" height="42" rx="8" fill="#6a3040"/><text x="58" y="203" class="t">NEITHER / not sure</text>
  </g>
  <g transform="translate(828 70)">
    <rect width="340" height="240" rx="14" class="p"/><text x="22" y="38" class="t">3. Align and save</text>
    <text x="22" y="74" class="s">Bose QC Ultra +120 ms</text>
    <rect x="28" y="94" width="260" height="16" rx="8" fill="#3b82f6"/>
    <text x="22" y="144" class="s">Ear (stick) 0 ms</text>
    <rect x="22" y="164" width="266" height="16" rx="8" fill="#60a5fa"/>
    <rect x="22" y="198" width="170" height="32" rx="8" class="g"/><text x="35" y="220" class="s">Save preset for pair</text>
  </g>
</svg>
